<style>
  :root{
    --bg:#181009; --panel:#1f150c; --panel2:#261a0f; --ink:#f5efe3; --body:rgba(245,239,227,.68);
    --dim:rgba(245,239,227,.42); --line:rgba(245,239,227,.12);
    --accent:#f0895f; --leaf:#7fc07a; --amber:#e0a94a; --heart:#e07a5f; --blue:#63a9d6; --pink:#e090b5;
    --serif:"Fraunces",Georgia,serif; --sans:"Hanken Grotesk",-apple-system,system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--body);background:#140d06;min-height:100vh;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% -10%,#241811,#150d07 60%,#0c0704)}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--ink)}
  .brand small{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;margin-left:8px}
  .meta{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;align-items:center;gap:10px}
  .btn{font-family:var(--sans);font-weight:600;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .demoBanner{margin:12px 0 0;padding:9px 14px;border-radius:10px;background:rgba(224,169,74,.12);border:1px solid rgba(224,169,74,.4);color:var(--amber);font-size:12.5px;font-weight:600;display:none}

  /* hint tooltip */
  .hint{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);color:var(--dim);font-family:var(--serif);font-style:italic;font-size:10px;line-height:1;cursor:help;position:relative;margin-left:6px;vertical-align:middle;flex:none}
  .hint:hover{border-color:var(--accent);color:var(--accent)}
  .hint:hover::after{content:attr(data-tip);position:absolute;bottom:150%;left:50%;transform:translateX(-50%);width:200px;background:#0d0803;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--sans);font-weight:400;font-size:11.5px;line-height:1.45;color:var(--body);text-transform:none;letter-spacing:0;text-align:left;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.55);pointer-events:none}
  .hint:hover::before{content:"";position:absolute;bottom:150%;left:50%;transform:translate(-50%,55%) rotate(45deg);width:8px;height:8px;background:#0d0803;border-right:1px solid var(--line);border-bottom:1px solid var(--line);z-index:61}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:18px 0 14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .kpi .n{font-family:var(--serif);font-size:27px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
  .kpi .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:7px;display:flex;align-items:center}
  .kpi.hot .n{color:var(--leaf)}

  /* insights */
  .sig{margin:16px 0 4px}
  .insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
  .insight{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .insight .n{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
  .insight .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:7px;display:flex;align-items:center}
  .insight .sub{font-size:11.5px;color:var(--body);margin-top:6px}
  .corr{margin-top:10px;padding:12px 15px;border-radius:13px;background:rgba(127,192,122,.08);border:1px solid rgba(127,192,122,.28);font-size:13.5px;line-height:1.5;color:var(--body)}

  .corr .em{color:var(--ink);font-weight:700}

  .secTitle{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:8px 0 10px;display:flex;align-items:center}
  .tabs{display:flex;gap:18px;margin:18px 0 14px;border-bottom:1px solid var(--line)}
  .tab{font-family:var(--sans);font-weight:600;font-size:14px;color:var(--dim);background:none;border:0;border-bottom:2px solid transparent;padding:9px 2px;margin-bottom:-1px;cursor:pointer}

  .panelcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 15px}
  .ct{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;display:flex;align-items:center}
  .legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .lchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-weight:600;font-size:11.5px;color:var(--ink);background:rgba(245,239,227,.05);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
  .lchip .dot{width:9px;height:9px;border-radius:50%}

  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}

  .search:focus{border-color:var(--accent)}
  .vtoggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .vtoggle button{font-family:var(--sans);font-weight:600;font-size:12px;color:var(--dim);background:none;border:0;padding:9px 13px;cursor:pointer}
  .vtoggle button.on{background:var(--accent);color:#1a120a}
  .count{font-family:var(--mono);font-size:11px;color:var(--dim)}

  .st{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

  .users.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
  .users.grid .item{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .users.grid .head{padding:14px 15px;cursor:pointer}
  .users.grid .nm{font-weight:700;font-size:15px;color:var(--ink)}
  .users.grid .h{display:flex;align-items:center;gap:9px}
  .users.grid .em{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 0}

  .miniwhen{margin:10px 0 0;font-size:11.5px;color:var(--dim)} .miniwhen b{color:var(--body);font-weight:600}

  .users.list{display:flex;flex-direction:column;gap:8px}
  .users.list .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .users.list .head{display:flex;align-items:center;gap:11px;padding:12px 15px;cursor:pointer}
  .users.list .nm{font-weight:700;font-size:14px;color:var(--ink)}
  .users.list .em{font-family:var(--mono);font-size:10px;color:var(--dim)}
  .users.list .grow{flex:1;min-width:0}
  .users.list .rmeta{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
  .chev{color:var(--dim);font-size:15px;transition:transform .18s} .item.open .chev{transform:rotate(90deg)}

  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
  .trow td{padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer;vertical-align:top}
  .trow:hover td{background:var(--panel)}
  .trow .tem{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}
  .tdetail{display:none} .tdetail.open{display:table-row} .tdetail td{padding:0 13px 14px;background:var(--panel2)}

  .detail{display:none;padding:0 15px 15px;border-top:1px solid var(--line);background:var(--panel2)}
  .item.open .detail{display:block}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-top:14px}
  .dk{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .dv{display:block;font-size:13px;color:var(--ink);margin-top:3px;word-break:break-word}
  .dsub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:15px 0 8px}
  .note{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;background:rgba(245,239,227,.04);border:1px solid var(--line);border-radius:9px;margin-bottom:6px}
  .note .nb{color:var(--ink);font-size:13px} .note .nt{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
  .empty{font-size:12px;color:var(--dim);font-style:italic}
  .danger{margin-top:15px;padding:12px 14px;border-radius:12px;background:rgba(224,122,95,.07);border:1px solid rgba(224,122,95,.28)}
  .danger .dsub{margin:0 0 4px;color:var(--heart)}
  .danger p{font-size:11.5px;color:var(--body);margin-bottom:10px;line-height:1.45}
  .delbtn{font-family:var(--sans);font-weight:700;font-size:12.5px;color:#fff;background:var(--heart);border:1px solid var(--heart);border-radius:9px;padding:9px 15px;cursor:pointer}
  .delbtn:hover{background:#c9694f;border-color:#c9694f}

  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:2px}
  .cell{width:9px;height:9px;border-radius:2px;background:rgba(245,239,227,.06)}
  .cell.l1{background:rgba(127,192,122,.35)} .cell.l2{background:rgba(127,192,122,.6)} .cell.l3{background:var(--leaf)}

  /* notes tab */
  .notesList{display:flex;flex-direction:column;gap:9px}
  .notecard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
  .notecard .nbody{font-size:14.5px;color:var(--ink);line-height:1.45}
  .notecard .nmeta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;flex-wrap:wrap}
  .notecard .who{color:var(--ink);font-weight:700}
  .notecard .arrow{color:var(--dim)}
  .notecard .to{color:var(--leaf);font-weight:600}
  .notecard .to.solo{color:var(--amber)}
  .notecard .when{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}

  .gate{max-width:360px;margin:14vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center}
  .gate h1{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .gate p{font-size:13px;color:var(--dim);margin-bottom:16px}
  .gate input{width:100%;height:44px;border-radius:11px;border:1px solid var(--line);background:rgba(245,239,227,.05);color:var(--ink);font-family:var(--mono);font-size:14px;padding:0 13px;outline:none;text-align:center}
  .gate input:focus{border-color:var(--accent)}
  .gate .go{width:100%;height:44px;margin-top:11px;border:0;border-radius:11px;background:var(--accent);color:#1a120a;font-family:var(--sans);font-weight:700;font-size:14px;cursor:pointer}
  .gate .err{color:var(--heart);font-size:12px;margin-top:10px;min-height:16px}
</style>

    function Y(v){return pt+ih-(v/max)*ih;}
    var grid='',ylab='';
    [0,0.5,1].forEach(function(f){var y=pt+ih-f*ih;grid+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-prr)+'" y2="'+y+'" stroke="rgba(245,239,227,.08)"/>';ylab+='<text x="'+(pl-5)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="rgba(245,239,227,.4)" font-family="monospace">'+Math.round(max*f)+'</text>';});
    var lines=defs.map(function(s){var pts=daily.map(function(r,i){return X(i).toFixed(1)+','+Y(r[s.key]||0).toFixed(1);}).join(' ');return '<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';}).join('');
    var xlab='';[0,Math.floor(n/2),n-1].forEach(function(i){if(daily[i]){var d=new Date(daily[i].d);xlab+='<text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="rgba(245,239,227,.4)" font-family="monospace">'+d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</text>';}});
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">'+grid+ylab+lines+xlab+'</svg>';
  }
  function drawBars(arr,labels,color){
    arr=arr||[]; if(!arr.length||Math.max.apply(null,arr)===0) return '<div class="empty">no data yet</div>';
    var max=Math.max(1,Math.max.apply(null,arr));
    var W=380,H=140,pl=6,prr=6,pt=8,pb=18,iw=W-pl-prr,ih=H-pt-pb,n=arr.length,gap=iw/n,bw=gap*0.66;
    var bars=arr.map(function(v,i){var h=(v/max)*ih,x=pl+i*gap+(gap-bw)/2,y=pt+ih-h;return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.5,h).toFixed(1)+'" rx="1.5" fill="'+color+'"><title>'+labels[i]+': '+v+'</title></rect>';}).join('');
    var lab=labels.map(function(l,i){if(n>12&&i%3!==0)return '';var x=pl+i*gap+gap/2;return '<text x="'+x.toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle" font-size="8" fill="rgba(245,239,227,.4)" font-family="monospace">'+l+'</text>';}).join('');
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+bars+lab+'</svg>';
  }
  function drawLegend(){return SERIES.map(function(s){return '<button class="lchip'+(state.series[s.key]?'':' off')+'" data-k="'+s.key+'"><span class="dot" style="background:'+s.color+'"></span><span>'+s.label+'</span></button>';}).join('');}
  function redrawLine(){document.getElementById('linechart').innerHTML=drawLine();document.getElementById('legend').innerHTML=drawLegend();}

  function heatHTML(heat){
    var map={}; (heat||[]).forEach(function(h){map[h.d]=h.c;});
    var days=77,cells='',today=new Date();today.setHours(0,0,0,0);
    for(var i=days-1;i>=0;i--){var dt=new Date(today);dt.setDate(today.getDate()-i);var key=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');var c=map[key]||0,lv=c===0?'':' l'+(c<3?1:c<6?2:3);cells+='<div class="cell'+lv+'" title="'+key+': '+c+'"></div>';}
    return '<div class="heat">'+cells+'</div>';
  }
  function detailInner(u){
    var notes=(u.note_list||[]).map(function(n){return '<div class="note"><span class="nb">'+esc(n.body)+'</span><span class="nt">'+rel(n.at)+'</span></div>';}).join('') || '<div class="empty">no notes</div>';
    return '<div class="dgrid">'
      +'<div><span class="dk">Joined</span><span class="dv">'+fmt(u.joined)+'</span></div>'
      +'<div><span class="dk">Last active</span><span class="dv">'+fmt(u.last_active)+'</span></div>'
      +'<div><span class="dk">Last sign-in</span><span class="dv">'+fmt(u.last_sign_in)+'</span></div>'
      +'<div><span class="dk">Partner</span><span class="dv">'+(u.paired?(esc(u.partner_name||'—')+(u.partner_email?'<br>'+esc(u.partner_email):'')):'solo')+'</span></div>'
      +'<div><span class="dk">Bixi</span><span class="dv">🌱 '+esc(u.bixi||'—')+'</span></div>'
      +'<div><span class="dk">Care · Notes</span><span class="dv">'+u.care+' · '+u.notes+'</span></div>'
      +'<div><span class="dk">Email</span><span class="dv">'+esc(u.email||'—')+'</span></div>'
      +'<div><span class="dk">Signup</span><span class="dv">'+(u.apple?'Apple':'Email')+(u.device?' · 📱 device':'')+'</span></div>'
      +'</div><div class="dsub">Activity · last 11 weeks</div>'+heatHTML(u.heat)
      +'<div class="dsub">Notes written ('+(u.note_list||[]).length+')</div>'+notes
      +'<div class="danger"><div class="dsub">Danger zone</div><p>Permanently deletes this account, their Bixi, notes and history. This cannot be undone.</p><button class="delbtn" data-id="'+esc(u.id)+'" data-name="'+esc(u.name)+'">Delete '+esc(u.name)+'</button></div>';
  }
  function deleteUser(id,name){
    if(!id||id==='undefined'){alert('No id for this user — hit Refresh to load current data, then try again.');return;}
    if(!confirm('Delete '+name+'?\n\nThis permanently removes their account, Bixi, notes and history. This cannot be undone.'))return;
    var tok=localStorage.getItem(TOKEN_KEY);
    fetch(DEL_URL,{method:'POST',headers:{'x-admin-token':tok,'content-type':'application/json'},body:JSON.stringify({id:id})})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;});})
      .then(function(){load();})
      .catch(function(e){alert('Delete failed: '+e.message);});
  }
  function chips(u){var c='<span class="chip '+(u.paired?'paired':'solo')+'">'+(u.paired?'paired':'solo')+'</span>';c+=u.apple?'<span class="chip">Apple</span>':'<span class="chip">Email</span>';c+=u.device?'<span class="chip device">📱</span>':'';c+=u.bixi?'<span class="chip">🌱 '+esc(u.bixi)+'</span>':'';return c;}
  function itemGrid(u){var st=statusOf(u.last_active);return '<div class="item"><div class="head"><div class="h"><span class="st '+st+'"></span><div style="min-width:0"><div class="nm">'+esc(u.name)+'</div><div class="em">'+esc(u.email||'—')+'</div></div></div><div class="chips">'+chips(u)+'</div><div class="miniwhen">active <b>'+rel(u.last_active)+'</b> · joined <b>'+rel(u.joined)+'</b> · care <b>'+u.care+'</b></div></div><div class="detail">'+detailInner(u)+'</div></div>';}
  function itemList(u){var st=statusOf(u.last_active);return '<div class="item"><div class="head"><span class="st '+st+'"></span><div class="grow"><div class="nm">'+esc(u.name)+'</div><div class="em">'+esc(u.email||'—')+'</div></div><div class="rmeta">'+(u.paired?'paired':'solo')+' · '+u.care+'♥ · '+u.notes+'✎ · '+rel(u.last_active)+'</div><span class="chev">›</span></div><div class="detail">'+detailInner(u)+'</div></div>';}
  function tableHTML(us){var rows=us.map(function(u){var st=statusOf(u.last_active);return '<tr class="trow"><td><span class="st '+st+'"></span> '+esc(u.name)+'<div class="tem">'+esc(u.email||'—')+'</div></td><td>'+st+'</td><td>'+fmtShort(u.joined)+'</td><td>'+rel(u.last_active)+'</td><td>'+u.care+'</td><td>'+u.notes+'</td><td>'+(u.paired?esc(u.partner_name||'yes'):'solo')+'</td><td>'+(u.device?'📱':'')+'</td></tr><tr class="tdetail"><td colspan="8">'+detailInner(u)+'</td></tr>';}).join('');return '<div class="tablewrap"><table><thead><tr><th>User</th><th>Status</th><th>Joined</th><th>Last active</th><th>Care</th><th>Notes</th><th>Partner</th><th>Dev</th></tr></thead><tbody>'+rows+'</tbody></table></div>';}

  function filtered(){var q=state.q.toLowerCase();return (state.data.users||[]).filter(function(u){return !q||(u.name||'').toLowerCase().indexOf(q)>-1||(u.email||'').toLowerCase().indexOf(q)>-1;});}
  function renderList(){var wrap=document.getElementById('listwrap'),us=filtered(),v=state.view;document.getElementById('count').textContent=us.length+' shown';if(v==='table')wrap.innerHTML=tableHTML(us);else wrap.innerHTML='<div class="users '+v+'">'+us.map(v==='grid'?itemGrid:itemList).join('')+'</div>';}

  /* ---------- notes ---------- */
  function allNotes(){
    var out=[];(state.data.users||[]).forEach(function(u){(u.note_list||[]).forEach(function(n){out.push({body:n.body,at:n.at,author:u.name,author_email:u.email,partner:u.partner_name,paired:u.paired});});});
    out.sort(function(a,b){return new Date(b.at)-new Date(a.at);});return out;
  }
  function renderNotes(){
    var q=(state.nq||'').toLowerCase();
    var notes=allNotes().filter(function(n){return !q||(n.body||'').toLowerCase().indexOf(q)>-1||(n.author||'').toLowerCase().indexOf(q)>-1||(n.partner||'').toLowerCase().indexOf(q)>-1;});
    var c=document.getElementById('ncount');if(c)c.textContent=notes.length+' notes';
    var html=notes.map(function(n){return '<div class="notecard"><div class="nbody">“'+esc(n.body)+'”</div><div class="nmeta"><span class="who">'+esc(n.author)+'</span><span class="arrow">→</span><span class="to'+(n.paired?'':' solo')+'">'+(n.paired?esc(n.partner||'partner'):'solo (no partner)')+'</span><span class="when">'+rel(n.at)+'</span></div></div>';}).join('') || '<div class="empty">no notes written yet</div>';
    document.getElementById('noteswrap').innerHTML=html;
  }

  /* ---------- insights ---------- */
  function computeInsights(){
    var us=state.data.users||[], t=state.data.totals||{}, tot=us.length||t.users||0;
    var careUsers=us.filter(function(u){return u.care>0;}).length;
    var noteWriters=us.filter(function(u){return u.notes>0;}).length;
    var paired=us.filter(function(u){return u.paired;}), solo=us.filter(function(u){return !u.paired;});
    function avg(a){return a.length?a.reduce(function(s,u){return s+(u.care||0);},0)/a.length:0;}
    return {tot:tot,careUsers:careUsers,noteWriters:noteWriters,paired:paired.length,solo:solo.length,
      pAvg:avg(paired),sAvg:avg(solo),
      activation:Math.min(100,pct(careUsers,tot)),retention:Math.min(100,pct(t.active_7d,tot)),pairRate:Math.min(100,pct(paired.length,tot)),
      avgCare:careUsers?Math.round((t.care_events||0)/careUsers*10)/10:0};
  }
  function insightsHTML(){
    var x=computeInsights();
    var cards=[
      ['activation',x.activation+'%','Activation','Share of signups who have cared for Bixi at least once. Low means people sign up but never really start.'],
      ['retention',x.retention+'%','7-day retention','Share of all users active (care, note, or sign-in) in the last 7 days. Your stickiness signal.'],
      ['pairRate',x.pairRate+'%','Paired up','Share of users connected with a partner. Bixi is built for two — pairing is the core "aha".'],
      ['avgCare',x.avgCare,'Care / active user','Average feed/water/pet actions per user who has done at least one. Depth of engagement.']
    ].map(function(c){return '<div class="insight"><div class="n">'+c[1]+'</div><div class="l">'+c[2]+hint(c[3])+'</div></div>';}).join('');
    var corr='';
    if(x.paired&&x.solo){
      var ratio=x.sAvg>0?(x.pAvg/x.sAvg):(x.pAvg>0?Infinity:0);
      var rtxt=ratio===Infinity?'far':(Math.round(ratio*10)/10)+'×';
      corr='<div class="corr">🔗 <span class="em">Paired users care '+rtxt+' more.</span> Paired average <b>'+(Math.round(x.pAvg*10)/10)+'</b> care actions each vs <b>'+(Math.round(x.sAvg*10)/10)+'</b> for solo users — getting people paired is your biggest lever.</div>';
    }
    return '<div class="secTitle">Signals'+hint('Derived from your raw numbers — the "so what" behind the counts above. Hover any ⓘ for a plain-English definition.')+'</div><div class="insights">'+cards+'</div>'+corr;
  }

  function paint(){
    var d=state.data,t=d.totals;
    var KPI=[
      ['users','Total','Everyone who has created an account.',0],
      ['active_7d','Active 7d','Users with any activity (care, note, or sign-in) in the last 7 days.',1],
      ['new_7d','New 7d','Accounts created in the last 7 days.',1],
      ['paired','Paired','Users connected with a partner.',0],
      ['solo','Solo','Users not yet paired with anyone.',0],
      ['care_events','Care','Total feed / water / pet actions across all users.',0],
      ['notes','Notes','Total notes written across all users.',0],
      ['deletions_30d','Deleted 30d','Accounts deleted in the last 30 days — your churn signal.',0]
    ];
    var cards=KPI.map(function(k){return '<div class="kpi'+(k[3]?' hot':'')+'"><div class="n">'+(t[k[0]]==null?0:t[k[0]])+'</div><div class="l">'+k[1]+hint(k[2])+'</div></div>';}).join('');
    app.innerHTML='<div class="top"><div class="brand">Bixi<small>Admin</small></div><div class="meta"><span>updated '+rel(d.generated_at)+'</span><button class="btn" onclick="load()">↻ Refresh</button><button class="btn" onclick="signout()">Sign out</button></div></div>'
      +'<div class="demoBanner" id="demoB">Demo data — enter your token for live numbers.</div>'
      +'<div class="kpis">'+cards+'</div>'
      +insightsHTML()
      +'<div class="tabs"><button class="tab '+(state.tab==='users'?'on':'')+'" data-t="users">Users</button><button class="tab '+(state.tab==='notes'?'on':'')+'" data-t="notes">Notes</button><button class="tab '+(state.tab==='trends'?'on':'')+'" data-t="trends">Trends</button></div>'
      +'<div id="tabbody"></div>';
    if(d.__demo) document.getElementById('demoB').style.display='block';
    app.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){state.tab=b.dataset.t;localStorage.setItem('bixi_admin_tab',state.tab);paint();});});
    renderTab();
  }
  function renderTab(){
    var body=document.getElementById('tabbody'), d=state.data;
    if(state.tab==='trends'){
      var s=d.series||{};
      var shr=peakIdx(s.signups_by_hour), sdw=peakIdx(s.signups_by_dow);
      var peakTxt=(shr.v>0)?'<div class="peak">📈 Most signups land around <b>'+hourLabelLong(shr.i)+' UTC</b>'+(sdw.v>0?', and <b>'+DOW_FULL[sdw.i]+'</b> is your busiest day.':'.')+' Good windows to post or push.</div>':'';
      var chr=peakIdx(s.by_hour), cdw=peakIdx(s.by_dow);
      var careTxt=(chr.v>0)?'<div class="peak">🌱 People care for Bixi most around <b>'+hourLabelLong(chr.i)+' UTC</b>'+(cdw.v>0?' and on <b>'+DOW_FULL[cdw.i]+'s</b>.':'.')+'</div>':'';
      body.innerHTML='<div class="panelcard"><div class="ct">Growth &amp; activity over time'+hint('Each colored line is a metric. Toggle them below. "Total users" is cumulative; the rest are per-day counts.')+'</div><div id="linechart"></div><div class="legend" id="legend"></div></div>'
        +'<div class="secTitle" style="margin-top:16px">When downloads come in'+hint('We can\'t see App Store installs directly, so this uses new sign-ups (which happen right after download) as the closest proxy for when people are grabbing Bixi.')+'</div>'
        +'<div class="twocol"><div class="panelcard"><div class="ct">New signups by hour (UTC)</div><div id="shourchart"></div></div><div class="panelcard"><div class="ct">New signups by weekday</div><div id="sdowchart"></div></div></div>'+peakTxt
        +'<div class="secTitle" style="margin-top:16px">When people use Bixi'+hint('Care actions (feed / water / pet) by time — shows when your users are actually engaging, not just downloading.')+'</div>'
        +'<div class="twocol"><div class="panelcard"><div class="ct">Care activity by hour (UTC)</div><div id="hourchart"></div></div><div class="panelcard"><div class="ct">Care activity by weekday</div><div id="dowchart"></div></div></div>'+careTxt;
      redrawLine();
      var hrs=Array.from({length:24},function(_,i){return i%3===0?hourLabel(i):'';});
      document.getElementById('shourchart').innerHTML=drawBars(s.signups_by_hour||[], Array.from({length:24},function(_,i){return i;}), '#7fc07a');
      document.getElementById('sdowchart').innerHTML=drawBars(s.signups_by_dow||[], DOW_SHORT, '#f0895f');
      document.getElementById('hourchart').innerHTML=drawBars(s.by_hour||[], Array.from({length:24},function(_,i){return i;}), '#63a9d6');
      document.getElementById('dowchart').innerHTML=drawBars(s.by_dow||[], DOW_SHORT, '#e0a94a');
      document.getElementById('legend').addEventListener('click',function(e){var b=e.target.closest('.lchip');if(!b)return;var k=b.dataset.k;state.series[k]=!state.series[k];localStorage.setItem(SERIES_KEY,JSON.stringify(state.series));redrawLine();});
    } else if(state.tab==='notes'){
      body.innerHTML='<div class="toolbar"><input class="search" id="nq" placeholder="Search notes, author or partner…"/><span class="count" id="ncount"></span></div><div class="notesList" id="noteswrap"></div>';
      var nq=document.getElementById('nq');nq.value=state.nq;nq.addEventListener('input',function(){state.nq=this.value;renderNotes();});
      renderNotes();
    } else {
      var vt=['grid','list','table'].map(function(v){return '<button data-v="'+v+'" class="'+(state.view===v?'on':'')+'">'+(v[0].toUpperCase()+v.slice(1))+'</button>';}).join('');
      body.innerHTML='<div class="toolbar"><input class="search" id="q" placeholder="Search name or email…"/><div class="vtoggle">'+vt+'</div><span class="count" id="count"></span></div><div id="listwrap"></div>';
      var q=document.getElementById('q');q.value=state.q;q.addEventListener('input',function(){state.q=this.value;renderList();});
      body.querySelectorAll('.vtoggle button').forEach(function(b){b.addEventListener('click',function(){state.view=b.dataset.v;localStorage.setItem(VIEW_KEY,state.view);renderTab();});});
      document.getElementById('listwrap').addEventListener('click',function(e){var del=e.target.closest('.delbtn');if(del){e.stopPropagation();deleteUser(del.dataset.id,del.dataset.name);return;}var tr=e.target.closest('.trow');if(tr){var det=tr.nextElementSibling;if(det&&det.classList.contains('tdetail'))det.classList.toggle('open');return;}var h=e.target.closest('.head');if(h){var it=h.closest('.item');if(it)it.classList.toggle('open');}});
      renderList();
    }
  }
  function render(data){state.data=data;paint();}

  function gate(err){app.innerHTML='<div class="gate"><h1>Bixi Admin</h1><p>Enter your admin token for live analytics.</p><input id="tok" type="password" placeholder="admin token" autocomplete="off"/><button class="go" onclick="saveTok()">View dashboard</button><div class="err">'+(err||'')+'</div></div>';var i=document.getElementById('tok');i.focus();i.addEventListener('keydown',function(e){if(e.key==='Enter')saveTok();});}
  window.saveTok=function(){var v=document.getElementById('tok').value.trim();if(!v)return;localStorage.setItem(TOKEN_KEY,v);load();};
  window.signout=function(){localStorage.removeItem(TOKEN_KEY);gate();};
  window.load=function(){
    if(location.search.indexOf('demo')>-1){var d=JSON.parse(JSON.stringify(DEMO));d.__demo=true;render(d);return;}
    var tok=localStorage.getItem(TOKEN_KEY);if(!tok){gate();return;}
    app.innerHTML='<div class="gate"><h1>Loading…</h1></div>';
    fetch(FN_URL,{headers:{'x-admin-token':tok}})
      .then(function(r){if(r.status===401){localStorage.removeItem(TOKEN_KEY);throw new Error('Wrong token');}if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(render)
      .catch(function(e){gate(e.message==='Wrong token'?'Wrong token — try again.':'Couldn’t reach the server. '+e.message);});
  };
  load();
</script>
</body>
</html>
